<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800" width="100%" height="160" style="background:#000000; border-radius:0px;">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      @keyframes eyeGlow { 0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px #e11d48); } 50% { opacity: 1; filter: drop-shadow(0 0 8px #ff1a42); } }
      .star { animation: twinkle 3s infinite ease-in-out; }
      .spider-eye { animation: eyeGlow 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Glow -->
  <circle cx="400" cy="80" r="250" fill="url(#redGlow)" />

  <!-- Spiderweb Lines -->
  <g stroke="#9f1239" stroke-width="0.8" opacity="0.4" fill="none">
    <line x1="400" y1="80" x2="100" y2="0" />
    <line x1="400" y1="80" x2="700" y2="0" />
    <line x1="400" y1="80" x2="50" y2="80" />
    <line x1="400" y1="80" x2="750" y2="80" />
    <line x1="400" y1="80" x2="200" y2="160" />
    <line x1="400" y1="80" x2="600" y2="160" />

    <!-- Webs concentric -->
    <path d="M 400 40 Q 430 60 440 80 Q 430 100 400 110 Q 370 100 360 80 Q 370 60 400 40 Z" />
    <path d="M 400 15 Q 470 50 490 80 Q 470 130 400 145 Q 330 130 310 80 Q 330 50 400 15 Z" />
  </g>

  <!-- Twinkling Stars -->
  <circle cx="150" cy="40" r="1.5" fill="#fff" class="star" style="animation-delay: 0.2s;" />
  <circle cx="680" cy="50" r="2" fill="#e11d48" class="star" style="animation-delay: 1.2s;" />
  <circle cx="250" cy="120" r="1" fill="#fff" class="star" style="animation-delay: 0.7s;" />
  <circle cx="580" cy="110" r="1.5" fill="#fff" class="star" style="animation-delay: 2.1s;" />

  <!-- Spider Silhouette with Glowing Eyes -->
  <g transform="translate(400, 75)">
    <!-- Legs -->
    <path d="M0 0 Q -25 -20 -45 -10 M0 0 Q -25 -5 -40 15 M0 0 Q -20 10 -35 35 M0 0 Q -15 25 -25 50" stroke="#1f0408" stroke-width="2" fill="none" />
    <path d="M0 0 Q 25 -20 45 -10 M0 0 Q 25 -5 40 15 M0 0 Q 20 10 35 35 M0 0 Q 15 25 25 50" stroke="#1f0408" stroke-width="2" fill="none" />
    <!-- Body -->
    <ellipse cx="0" cy="12" rx="8" ry="11" fill="#090103" />
    <ellipse cx="0" cy="2" rx="6" ry="7" fill="#120205" />
    <!-- Glowing Red Eyes -->
    <circle cx="-2" cy="0" r="1.2" fill="#ff1a42" class="spider-eye" />
    <circle cx="2" cy="0" r="1.2" fill="#ff1a42" class="spider-eye" style="animation-delay: 0.5s;" />
  </g>
</svg>
