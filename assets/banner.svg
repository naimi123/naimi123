<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Mustapha Naimi — Full-Stack Web Developer — modern dark banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="55%" stop-color="#080d1c"/>
      <stop offset="100%" stop-color="#100a1e"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="150" cy="55" r="160" fill="url(#violetGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="240" r="180" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values="1;0.7;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- drifting particles -->
  <g>
    <circle cx="240" cy="210" r="2.2" fill="#8B5CF6"><animate attributeName="cy" values="210;180;210" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.2;0.7" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1.8" fill="#06B6D4"><animate attributeName="cy" values="70;45;70" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.15;0.6" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="120" r="1.6" fill="#06B6D4"><animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="90" r="2" fill="#8B5CF6"><animate attributeName="cy" values="90;65;90" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.2;0.7" dur="9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating glass chips -->
  <g font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="70" y="60" width="104" height="38" rx="19" fill="url(#glassFill)" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <text x="122" y="85" fill="#c4b5fd">Laravel</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="6s" begin="1s" repeatCount="indefinite"/>
      <rect x="820" y="52" width="100" height="38" rx="19" fill="url(#glassFill)" stroke="#06B6D4" stroke-opacity="0.55"/>
      <text x="870" y="77" fill="#67e8f9">React</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
      <rect x="120" y="180" width="92" height="38" rx="19" fill="url(#glassFill)" stroke="#8B5CF6" stroke-opacity="0.45"/>
      <text x="166" y="205" fill="#c4b5fd">PHP</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="6.5s" begin="2s" repeatCount="indefinite"/>
      <rect x="800" y="170" width="110" height="38" rx="19" fill="url(#glassFill)" stroke="#06B6D4" stroke-opacity="0.45"/>
      <text x="855" y="195" fill="#67e8f9">&lt;/&gt;</text>
    </g>
  </g>

  <!-- name -->
  <text x="500" y="138" font-family="Segoe UI, Inter, sans-serif" font-size="50" font-weight="800" letter-spacing="7" text-anchor="middle" fill="url(#accent)">MUSTAPHA NAIMI</text>

  <!-- animated underline -->
  <rect x="395" y="156" width="210" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="500" y="192" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="500" letter-spacing="9" text-anchor="middle" fill="#c7d2fe">FULL-STACK WEB DEVELOPER</text>

  <!-- tech strip -->
  <text x="500" y="234" font-family="Segoe UI, Inter, sans-serif" font-size="13" letter-spacing="2" text-anchor="middle" fill="#94a3b8">PHP · Laravel · React.js · JavaScript · MySQL</text>

  <!-- bottom accent line -->
  <rect x="0" y="276" width="1000" height="4" fill="url(#accent)"/>
</svg>
