<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Mustapha's haunted house welcome banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#0d0208"/>
      <stop offset="100%" stop-color="#1c040d"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f6e5dc"/>
      <stop offset="100%" stop-color="#b8938d"/>
    </radialGradient>
    <linearGradient id="mansion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15101a"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#sky)"/>

  <!-- moon + blood glow -->
  <circle cx="820" cy="70" r="90" fill="url(#moonglow)"/>
  <circle cx="820" cy="70" r="34" fill="url(#moon)"/>

  <!-- twinkling stars -->
  <g fill="#e2e8f0">
    <circle cx="130" cy="45" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="205" cy="95" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="35" r="1.5"><animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="425" cy="60" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="30" r="1.3"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="55" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="130" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="120" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flying bats -->
  <g fill="#000000">
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 60 12; 120 4; 60 -8; 0 0" dur="14s" repeatCount="indefinite"/>
      <path d="M250,90 q8,-8 14,-3 q6,-9 14,-3 q-4,7 -10,10 q-9,4 -18,-4 Z"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; -70 -10; -130 8; -60 14; 0 0" dur="17s" repeatCount="indefinite"/>
      <path d="M420,60 q7,-7 12,-2 q5,-8 12,-3 q-3,6 -9,9 q-8,3 -15,-4 Z"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 50 -14; 100 2; 50 10; 0 0" dur="11s" repeatCount="indefinite"/>
      <path d="M620,100 q6,-6 10,-2 q4,-7 10,-2 q-3,5 -8,8 q-7,3 -12,-4 Z"/></g>
  </g>

  <!-- ground mist -->
  <g fill="#e2e8f0" fill-opacity="0.06">
    <ellipse cx="250" cy="245" rx="220" ry="22"><animate attributeName="cx" values="250;300;250" dur="16s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="700" cy="250" rx="260" ry="25"><animate attributeName="cx" values="700;640;700" dur="19s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- haunted mansion -->
  <g>
    <rect x="380" y="130" width="240" height="120" fill="url(#mansion)"/>
    <polygon points="380,130 500,70 620,130" fill="#0c0812"/>
    <polygon points="470,140 530,140 530,180 470,180" fill="#0d0a14"/>
    <rect x="496" y="160" width="8" height="20" fill="#e11d48"/>
    <g fill="#e11d48">
      <rect x="410" y="160" width="24" height="34" rx="2"><animate attributeName="opacity" values=".5;1;.5" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="566" y="160" width="24" height="34" rx="2"><animate attributeName="opacity" values="1;.4;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="446" y="205" width="20" height="30" rx="2"><animate attributeName="opacity" values=".6;1;.6" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="534" y="205" width="20" height="30" rx="2"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="600" y="90" width="34" height="160" fill="url(#mansion)"/>
    <polygon points="600,90 617,50 634,90" fill="#0c0812"/>
    <rect x="609" y="115" width="16" height="20" rx="1" fill="#e11d48"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></rect>
    <g stroke="#0a060e" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M140,250 L140,190 M140,215 L118,195 M140,205 L162,182 M126,180 L118,160"/>
      <path d="M880,250 L880,196 M880,218 L900,198 M880,208 L858,188 M902,192 L912,172"/>
    </g>
    <g stroke="#0a060e" stroke-width="3">
      <line x1="40" y1="252" x2="960" y2="252"/>
      <line x1="60" y1="230" x2="60" y2="252"/><line x1="100" y1="230" x2="100" y2="252"/>
      <line x1="740" y1="230" x2="740" y2="252"/><line x1="780" y1="230" x2="780" y2="252"/>
    </g>
  </g>

  <!-- corner spider web -->
  <g stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <line x1="0" y1="0" x2="60" y2="85"/><line x1="0" y1="0" x2="105" y2="65"/>
    <line x1="0" y1="0" x2="140" y2="30"/><line x1="0" y1="0" x2="160" y2="0"/>
    <path d="M38,48 Q72,52 95,60 Q88,35 62,28 Q34,22 30,0" />
    <path d="M60,42 Q92,44 110,48 Q105,26 84,22 Q60,17 48,0" />
    <line x1="128" y1="18" x2="128" y2="60" stroke-opacity="0.3"/>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="3.5s" repeatCount="indefinite"/>
      <ellipse cx="128" cy="72" rx="7" ry="9" fill="#1a1a22" stroke="#e11d48" stroke-width="1.2"/>
      <circle cx="128" cy="61" r="4" fill="#1a1a22" stroke="#e11d48" stroke-width="1.2"/>
      <circle cx="126.5" cy="60" r="1.2" fill="#e11d48"><animate attributeName="r" values="1.2;2;1.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="129.5" cy="60" r="1.2" fill="#e11d48"><animate attributeName="r" values="1.2;2;1.2" dur="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- welcome greeting -->
  <text x="500" y="245" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">Mustapha's Haunted Dev Lair</text>
  <text x="500" y="268" font-family="Georgia, serif" font-size="14" fill="#e11d48" text-anchor="middle" letter-spacing="4">🕸 W E L C O M E 🕸</text>
</svg>
