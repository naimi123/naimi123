<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220" style="background:#000000; border-radius:8px;">
  <defs>
    <radialGradient id="stackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes swingSkill {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(6px) rotate(2deg); }
      }
      @keyframes spiderSpin {
        0% { transform: translate(400px, 110px) rotate(0deg); }
        50% { transform: translate(400px, 110px) rotate(180deg); }
        100% { transform: translate(400px, 110px) rotate(360deg); }
      }
      @keyframes eyeBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #ff1a42); }
      }
      .skill-item-1 { animation: swingSkill 4s infinite ease-in-out; transform-origin: top center; }
      .skill-item-2 { animation: swingSkill 5s infinite ease-in-out 0.5s; transform-origin: top center; }
      .skill-item-3 { animation: swingSkill 4.5s infinite ease-in-out 1s; transform-origin: top center; }
      .center-spider { animation: spiderSpin 12s infinite linear; transform-origin: center; }
      .spider-eye { animation: eyeBlink 1s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="#000000" />
  <circle cx="400" cy="110" r="180" fill="url(#[stackGlow)" />

  <!-- Detailed Spiderweb Structure -->
  <g stroke="#9f1239" stroke-width="0.8" opacity="0.4" fill="none">
    <!-- Radial Lines -->
    <line x1="400" y1="110" x2="100" y2="10" />
    <line x1="400" y1="110" x2="700" y2="10" />
    <line x1="400" y1="110" x2="50" y2="110" />
    <line x1="400" y1="110" x2="750" y2="110" />
    <line x1="400" y1="110" x2="150" y2="210" />
    <line x1="400" y1="110" x2="650" y2="210" />
    <line x1="400" y1="110" x2="400" y2="5" />
    <line x1="400" y1="110" x2="400" y2="215" />

    <!-- Concentric Web Rings -->
    <circle cx="400" cy="110" r="40" />
    <circle cx="400" cy="110" r="80" />
    <circle cx="400" cy="110" r="130" />
  </g>

  <!-- Hanging Threads for Skills -->
  <g stroke="#e11d48" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="200" y1="0" x2="200" y2="60" />
    <line x1="400" y1="0" x2="400" y2="40" />
    <line x1="600" y1="0" x2="600" y2="60" />
  </g>

  <!-- Center Web Spider (Rotating in the middle web) -->
  <g class="center-spider">
    <!-- Legs -->
    <path d="M0 0 Q -15 -15 -30 -10 M0 0 Q -18 -2 -32 10 M0 0 Q -12 10 -25 25 M0 0 Q -8 18 -18 35" stroke="#1f0408" stroke-width="1.5" fill="none" />
    <path d="M0 0 Q 15 -15 30 -10 M0 0 Q 18 -2 32 10 M0 0 Q 12 10 25 25 M0 0 Q 8 18 18 35" stroke="#1f0408" stroke-width="1.5" fill="none" />
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="6" ry="9" fill="#090103" />
    <ellipse cx="0" cy="0" rx="4" ry="5" fill="#150205" />
    <!-- Eyes -->
    <circle cx="-1.5" cy="-1" r="1" fill="#ff1a42" class="spider-eye" />
    <circle cx="1.5" cy="-1" r="1" fill="#ff1a42" class="spider-eye" />
  </g>

</svg>
