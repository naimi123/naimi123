<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" style="background:#000000; border-radius:8px;">
  <defs>
    <radialGradient id="stackGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180307"/>
      <stop offset="100%" stop-color="#090103"/>
    </linearGradient>
    <style>
      @keyframes swingSkill {
        0%, 100% { transform: translateY(0) rotate(-1.5deg); }
        50% { transform: translateY(5px) rotate(1.5deg); }
      }
      @keyframes spiderSpin {
        0% { transform: translate(400px, 130px) rotate(0deg); }
        50% { transform: translate(400px, 130px) rotate(180deg); }
        100% { transform: translate(400px, 130px) rotate(360deg); }
      }
      @keyframes eyeBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #ff1a42); }
      }
      .skill-group-1 { animation: swingSkill 4s infinite ease-in-out; transform-origin: top center; }
      .skill-group-2 { animation: swingSkill 5s infinite ease-in-out 0.5s; transform-origin: top center; }
      .skill-group-3 { animation: swingSkill 4.5s infinite ease-in-out 1s; transform-origin: top center; }
      .skill-group-4 { animation: swingSkill 4.2s infinite ease-in-out 0.3s; transform-origin: top center; }
      .center-spider { animation: spiderSpin 14s infinite linear; transform-origin: center; }
      .spider-eye { animation: eyeBlink 1s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="#000000" />
  <circle cx="400" cy="130" r="200" fill="url(#stackGlow)" />

  <!-- Spiderweb Lines & Rings -->
  <g stroke="#9f1239" stroke-width="0.8" opacity="0.45" fill="none">
    <!-- Radial Lines -->
    <line x1="400" y1="130" x2="80" y2="10" />
    <line x1="400" y1="130" x2="720" y2="10" />
    <line x1="400" y1="130" x2="30" y2="130" />
    <line x1="400" y1="130" x2="770" y2="130" />
    <line x1="400" y1="130" x2="150" y2="230" />
    <line x1="400" y1="130" x2="650" y2="230" />
    <line x1="400" y1="130" x2="400" y2="5" />
    
    <!-- Concentric Web Rings -->
    <circle cx="400" cy="130" r="45" />
    <circle cx="400" cy="130" r="95" />
    <circle cx="400" cy="130" r="150" />
  </g>

  <!-- Hanging Threads (Red Dashed) -->
  <g stroke="#e11d48" stroke-width="1" stroke-dasharray="2 2" opacity="0.6">
    <line x1="150" y1="0" x2="150" y2="70" />
    <line x1="330" y1="0" x2="330" y2="55" />
    <line x1="530" y1="0" x2="530" y2="65" />
    <line x1="680" y1="0" x2="680" y2="50" />
  </g>

  <!-- Center Spider (Rotating in the middle web) -->
  <g class="center-spider">
    <path d="M0 0 Q -15 -15 -30 -10 M0 0 Q -18 -2 -32 10 M0 0 Q -12 10 -25 25 M0 0 Q -8 18 -18 35" stroke="#1f0408" stroke-width="1.5" fill="none" />
    <path d="M0 0 Q 15 -15 30 -10 M0 0 Q 18 -2 32 10 M0 0 Q 12 10 25 25 M0 0 Q 8 18 18 35" stroke="#1f0408" stroke-width="1.5" fill="none" />
    <ellipse cx="0" cy="8" rx="6" ry="9" fill="#090103" />
    <ellipse cx="0" cy="0" rx="4" ry="5" fill="#150205" />
    <circle cx="-1.5" cy="-1" r="1" fill="#ff1a42" class="spider-eye" />
    <circle cx="1.5" cy="-1" r="1" fill="#ff1a42" class="spider-eye" />
  </g>

  <!-- Skill 1: PHP (Left) -->
  <g class="skill-group-1" transform="translate(150, 70)">
    <rect x="-55" y="0" width="110" height="38" rx="19" fill="url(#badgeGrad)" stroke="#e11d48" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(225,29,72,0.4))"/>
    <circle cx="-32" cy="19" r="5" fill="#e11d48" />
    <text x="-14" y="24" fill="#ffffff" font-family="Segoe UI, monospace" font-size="14" font-weight="700">PHP</text>
  </g>

  <!-- Skill 2: React (Center-Left) -->
  <g class="skill-group-2" transform="translate(330, 55)">
    <rect x="-60" y="0" width="120" height="38" rx="19" fill="url(#badgeGrad)" stroke="#e11d48" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(225,29,72,0.4))"/>
    <circle cx="-37" cy="19" r="5" fill="#e11d48" />
    <text x="-18" y="24" fill="#ffffff" font-family="Segoe UI, monospace" font-size="14" font-weight="700">React</text>
  </g>

  <!-- Skill 3: JavaScript (Center-Right) -->
  <g class="skill-group-3" transform="translate(530, 65)">
    <rect x="-70" y="0" width="140" height="38" rx="19" fill="url(#badgeGrad)" stroke="#e11d48" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(225,29,72,0.4))"/>
    <circle cx="-47" cy="19" r="5" fill="#e11d48" />
    <text x="-28" y="24" fill="#ffffff" font-family="Segoe UI, monospace" font-size="14" font-weight="700">JavaScript</text>
  </g>

  <!-- Skill 4: MySQL (Right) -->
  <g class="skill-group-4" transform="translate(680, 50)">
    <rect x="-60" y="0" width="120" height="38" rx="19" fill="url(#badgeGrad)" stroke="#e11d48" stroke-width="1.5" filter="drop-shadow(0 0 6px rgba(225,29,72,0.4))"/>
    <circle cx="-37" cy="19" r="5" fill="#e11d48" />
    <text x="-18" y="24" fill="#ffffff" font-family="Segoe UI, monospace" font-size="14" font-weight="700">MySQL</text>
  </g>

</svg>
