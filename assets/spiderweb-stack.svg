<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800" width="100%" height="120" style="background:transparent;">
  <defs>
    <style>
      @keyframes swing {
        0% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
        100% { transform: rotate(-4deg); }
      }
      .swaying-group {
        transform-origin: top center;
        animation: swing 4s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Hanging Threads -->
  <line x1="200" y1="0" x2="200" y2="40" stroke="#9f1239" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="0" x2="400" y2="30" stroke="#9f1239" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.6"/>
  <line x1="600" y1="0" x2="600" y2="40" stroke="#9f1239" stroke-dasharray="2 2" stroke-width="1.5" opacity="0.6"/>

  <!-- Horizontal Web Connection -->
  <path d="M 50 20 Q 400 45 750 20" fill="none" stroke="#e11d48" stroke-width="0.8" opacity="0.3"/>
</svg>
